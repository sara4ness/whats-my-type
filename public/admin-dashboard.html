<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - User Typography Choices</title>
    <style>
        /* Base styles from index.css and App.css */
        :root {
            --primary-blue: #007bff;
            --primary-blue-hover: #0056b3;
            --border-color: rgb(200, 200, 200);
            --bg-light: #f9f9f9;
            --text-main: #213547;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
            background-color: white;
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Stats Grid - Matching optionBox aesthetic */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        /* Controls / Buttons - Matching navButton */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        button {
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: opacity 0.2s, transform 0.2s;
            background-color: var(--text-main);
            color: white;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        button.secondary {
            background-color: var(--bg-light);
            color: var(--text-main);
            border: 2px solid var(--border-color);
        }

        /* Data Sections - Clean and spaced */
        .data-section {
            background: white;
            padding: 30px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            margin-bottom: 30px;
        }

        .data-section h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 15px;
            background-color: var(--bg-light);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        /* Chart Elements */
        .bar {
            display: flex;
            align-items: center;
            margin: 12px 0;
        }

        .bar-label {
            min-width: 180px;
            font-weight: 500;
        }

        .bar-fill {
            height: 32px;
            background-color: var(--primary-blue);
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            color: white;
            font-size: 0.9rem;
            transition: width 0.5s ease-out;
        }

        .color-preview {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 3px;
            vertical-align: middle;
        }

        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Admin Dashboard</h1>
        
        <div id="error" class="error" style="display: none; background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 5px; margin-bottom: 20px;"></div>

        <div class="controls">
            <button onclick="loadData()">Refresh Data</button>
            <button onclick="exportCSV()" class="secondary">Export CSV</button>
            <button onclick="exportJSON()" class="secondary">Export JSON</button>
        </div>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <h3>Total Entries</h3>
                <div class="value" id="totalEntries">-</div>
            </div>
            <div class="stat-card">
                <h3>Avg Font Size</h3>
                <div class="value" id="avgFontSize">-</div>
            </div>
            <div class="stat-card">
                <h3>Avg Leading</h3>
                <div class="value" id="avgLeading">-</div>
            </div>
            <div class="stat-card">
                <h3>Top Font</h3>
                <div class="value" id="popularFont" style="font-size: 1.2rem;">-</div>
            </div>
        </div>

        <div class="data-section">
            <h2>Category Distribution</h2>
            <div id="categoryChart"></div>
        </div>

        <div class="data-section">
            <h2>Most Popular Fonts</h2>
            <div id="fontChart"></div>
        </div>

        <div class="data-section">
            <h2>All User Choices</h2>
            <div id="loading" class="loading">Fetching data...</div>
            <div id="tableContainer" style="overflow-x: auto; display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Category</th>
                            <th>Font</th>
                            <th>Size/Leading</th>
                            <th>Colors</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://whats-my-type-0y3i.onrender.com/api';

        async function loadData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('tableContainer').style.display = 'none';
                document.getElementById('error').style.display = 'none';

                // Load all data
                const [dataResponse, statsResponse] = await Promise.all([
                    fetch(`${API_URL}/get-all-choices`),
                    fetch(`${API_URL}/stats`)
                ]);

                const data = await dataResponse.json();
                const stats = await statsResponse.json();

                if (!data.success || !stats.success) {
                    throw new Error('Failed to load data');
                }

                // Update stats
                document.getElementById('totalEntries').textContent = stats.stats.totalEntries || 0;
                document.getElementById('avgFontSize').textContent = stats.stats.averageFontSize ? 
                    stats.stats.averageFontSize + 'px' : '-';
                document.getElementById('avgLeading').textContent = stats.stats.averageLeading || '-';
                document.getElementById('popularFont').textContent = stats.stats.popularFonts[0]?.specific_font || '-';

                // Render charts
                renderCategoryChart(stats.stats.fontCategories);
                renderFontChart(stats.stats.popularFonts);
                renderColorChart(stats.stats.popularColorSchemes);

                // Render table
                renderTable(data.data);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('error').textContent = 
                    'Error loading data. Check console for details.';
                document.getElementById('error').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderCategoryChart(categories) {
            const container = document.getElementById('categoryChart');
            const max = Math.max(...categories.map(c => c.count));
            
            container.innerHTML = categories.map(cat => `
                <div class="bar">
                    <div class="bar-label">${cat.font_category}</div>
                    <div class="bar-fill" style="width: ${(cat.count / max * 300)}px">
                        ${cat.count}
                    </div>
                </div>
            `).join('');
        }

        function renderFontChart(fonts) {
            const container = document.getElementById('fontChart');
            const max = Math.max(...fonts.map(f => f.count));
            const topFonts = fonts.slice(0, 10);
            
            container.innerHTML = topFonts.map(font => `
                <div class="bar">
                    <div class="bar-label">${font.specific_font}</div>
                    <div class="bar-fill" style="width: ${(font.count / max * 300)}px">
                        ${font.count}
                    </div>
                </div>
            `).join('');
        }

        function renderColorChart(colors) {
            const container = document.getElementById('colorChart');
            
            container.innerHTML = colors.map(color => `
                <div class="bar">
                    <div class="bar-label">
                        <span class="color-preview" style="background-color: ${color.text_color}"></span>
                        ${color.text_color} on 
                        <span class="color-preview" style="background-color: ${color.bg_color}"></span>
                        ${color.bg_color}
                    </div>
                    <div class="bar-fill" style="width: ${color.count * 50}px">
                        ${color.count}
                    </div>
                </div>
            `).join('');
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = data.map(row => `
                <tr>
                    <td>${row.id}</td>
                    <td class="timestamp">${new Date(row.timestamp).toLocaleString()}</td>
                    <td>${row.font_category}</td>
                    <td><strong>${row.specific_font}</strong></td>
                    <td>${row.font_size}px</td>
                    <td>${row.leading}</td>
                    <td>
                        <span class="color-preview" style="background-color: ${row.text_color}"></span>
                        ${row.text_color}
                        <br>
                        <span class="color-preview" style="background-color: ${row.bg_color}"></span>
                        ${row.bg_color}
                    </td>
                    <td style="font-size: 0.8rem; color: #666;">${row.session_id || '-'}</td>
                </tr>
            `).join('');
        }

        function exportCSV() {
            window.open(`${API_URL}/export-csv`, '_blank');
        }

        function exportJSON() {
            window.open(`${API_URL}/export-json`, '_blank');
        }

        // Load data on page load
        loadData();

        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
